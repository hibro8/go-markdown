name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate Bindings
        run: wails3 generate bindings -d="./frontend/src/bindings"

      - name: Build (amd64)
        run: go build -ldflags="-H windowsgui" -o release/go-markdown_windows_amd64.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build (arm64)
        run: go build -ldflags="-H windowsgui" -o release/go-markdown_windows_arm64.exe
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: release/

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate Bindings
        run: wails3 generate bindings -d="./frontend/src/bindings"

      - name: Build (${{ matrix.arch }})
        run: |
          mkdir -p release
          go build -o release/go-markdown_darwin_${{ matrix.arch }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate Bindings
        run: wails3 generate bindings -d="./frontend/src/bindings"

      - name: Build (${{ matrix.arch }})
        run: |
          mkdir -p release
          go build -o release/go-markdown_linux_${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-build
          path: release/

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-build*'
          path: release/
          merge-multiple: true

      - name: List release assets
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
